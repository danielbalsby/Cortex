<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lommekort</title>
<style>
:root{
  /* Layout: søgning øverst · kortliste · kort · journalbygger i højre side. Roligt klinisk grøn-grå. */
  --bg:#f5f6f3;--panel:#ffffff;--ink:#1c201e;--muted:#646b66;--line:#dfe3df;--accent:#2f5d50;--on-accent:#ffffff;
  --warn-bg:#fff3e2;--warn-ink:#8a4b00;--danger-bg:#fcebea;--danger-ink:#9b1c1c;--note-bg:#e6f1ec;--note-ink:#2f5d50;
  --field:#fafbf9;--focus:#2f5d50;--filled:#ecf4ef;--toast-bg:#1c201e;--toast-ink:#f5f6f3;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131614;--panel:#1b1f1d;--ink:#e8ece9;--muted:#9aa29d;--line:#2f3532;--accent:#7fb8a4;--on-accent:#0f1311;
  --warn-bg:#3a2a12;--warn-ink:#f2c27a;--danger-bg:#3b1716;--danger-ink:#f4a3a3;--note-bg:#1d2d27;--note-ink:#9fd1bf;
  --field:#222724;--focus:#7fb8a4;--filled:#20302a;--toast-bg:#e8ece9;--toast-ink:#131614;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#131614;--panel:#1b1f1d;--ink:#e8ece9;--muted:#9aa29d;--line:#2f3532;--accent:#7fb8a4;--on-accent:#0f1311;
  --warn-bg:#3a2a12;--warn-ink:#f2c27a;--danger-bg:#3b1716;--danger-ink:#f4a3a3;--note-bg:#1d2d27;--note-ink:#9fd1bf;
  --field:#222724;--focus:#7fb8a4;--filled:#20302a;--toast-bg:#e8ece9;--toast-ink:#131614;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header .brand{font-weight:600;letter-spacing:.2px}
#q{flex:1;max-width:420px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font-size:15px}
#q:focus,input:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.keys{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--field)}
main{display:grid;grid-template-columns:200px minmax(0,1fr) minmax(380px,460px);height:calc(100% - 53px)}
nav{border-right:1px solid var(--line);overflow:auto;padding:8px}
nav .div{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:10px 9px 4px}
nav button{display:flex;justify-content:space-between;align-items:center;gap:6px;width:100%;text-align:left;padding:7px 9px;border:0;border-radius:6px;background:none;color:var(--ink);font:inherit;cursor:pointer}
nav button:hover{background:var(--field)}
nav button.active{background:var(--note-bg);color:var(--note-ink);font-weight:600}
nav button.kb{outline:2px solid var(--focus)}
.badge{font-size:10px;font-weight:600;padding:1px 5px;border-radius:4px;white-space:nowrap}
.badge.DRAFT{background:var(--warn-bg);color:var(--warn-ink)}
.badge.APPROVED{background:var(--note-bg);color:var(--note-ink)}
#card{overflow:auto;padding:16px 24px 48px;min-width:0}
#card h1{font-size:20px;margin:0 0 4px;text-wrap:balance}
#card .meta{color:var(--muted);font-size:12px;margin-bottom:12px}
#card details{border-bottom:1px solid var(--line);padding:2px 0 8px;margin-top:10px}
#card summary{font-weight:600;font-size:15px;cursor:pointer;padding:4px 0;list-style:none}
#card summary::-webkit-details-marker{display:none}
#card summary::before{content:"▸";display:inline-block;width:1em;color:var(--muted);transition:transform .15s}
#card details[open]>summary::before{transform:rotate(90deg)}
#card ul{margin:4px 0;padding-left:20px}
#card li{margin:2px 0}
#card table{border-collapse:collapse;width:100%;margin:6px 0;font-size:13px}
#card th,#card td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
#card th{background:var(--field)}
#card blockquote{margin:6px 0;padding:8px 12px;border-left:3px solid var(--accent);background:var(--field)}
.tblwrap{overflow-x:auto}
.callout{padding:8px 12px;border-radius:6px;margin:6px 0;font-size:13px}
.callout-title{font-weight:600}
.callout-warning{background:var(--warn-bg);color:var(--warn-ink)}
.callout-danger{background:var(--danger-bg);color:var(--danger-ink)}
.callout-note{background:var(--note-bg);color:var(--note-ink)}
.tag{font-size:11px;color:var(--muted);white-space:nowrap}
.tag-tjek{color:var(--warn-ink);font-weight:600}
.tag-afventer{background:var(--warn-bg);color:var(--warn-ink);border-radius:4px;padding:0 4px;font-weight:600}
.wl{font-style:italic;color:var(--muted)}
.foot{color:var(--muted);font-size:12px;margin-top:24px}
.srcs{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0}
details.sec-0{background:var(--danger-bg);padding:2px 12px 8px!important;border-radius:8px;border:0!important}
details.sec-0>summary{color:var(--danger-ink)}
aside{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.jscroll{overflow:auto;padding:12px 14px 12px;flex:1;min-height:0}
.jfoot{border-top:1px solid var(--line);padding:10px 14px 12px;background:var(--panel)}
aside h3{margin:2px 0 8px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.jline{margin:0 0 10px}
.jkey{font-weight:600;font-size:12px;color:var(--muted);margin:8px 0 4px;text-transform:uppercase;letter-spacing:.05em}
.fgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px 8px}
.f{display:flex;flex-direction:column;grid-column:span 3;min-width:0}
.f.short{grid-column:span 1}
.f.wide{grid-column:1 / -1}
.f label{font-size:12px;color:var(--muted);margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f input,.f textarea{width:100%;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--ink);font:inherit;font-size:13px}
.f textarea{resize:vertical;min-height:34px}
.f.has input,.f.has textarea{background:var(--filled)}
.f .row{display:flex;gap:4px;align-items:flex-start}
.mini{border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:6px;font-size:11px;padding:3px 7px;cursor:pointer;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px dashed var(--line);background:var(--field);color:var(--ink);border-radius:999px;font:inherit;font-size:12px;padding:3px 9px;cursor:pointer}
.chip[data-s="1"]{border-style:solid;background:var(--note-bg);color:var(--note-ink)}
.chip[data-s="1"]::before{content:"nej · "}
.chip[data-s="2"]{border-style:solid;background:var(--danger-bg);color:var(--danger-ink);font-weight:600}
.chip[data-s="2"]::before{content:"JA · "}
.hint{font-size:11px;color:var(--muted);margin-top:4px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.btn{border:0;border-radius:7px;padding:7px 10px;font:inherit;font-size:13px;cursor:pointer;background:var(--accent);color:var(--on-accent)}
.btn kbd{background:transparent;color:inherit;border-color:currentColor;opacity:.8}
.btn.sec{background:var(--field);color:var(--ink);border:1px solid var(--line)}
#preview{white-space:pre-wrap;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:8px;max-height:17vh;overflow:auto}
#check{font-size:12px;margin:0 0 6px;display:flex;flex-direction:column;gap:2px}
#check .rf{color:var(--danger-ink);font-weight:600}
#check .un{color:var(--muted)}
#check summary{cursor:pointer}
#check .ap{color:var(--warn-ink)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-ink);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.show{opacity:.95}
@media (prefers-reduced-motion:reduce){#toast,#card summary::before{transition:none}}
button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.privacy{font-size:11px;color:var(--muted);margin-top:6px}
.empty{color:var(--muted);padding:40px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:1000px){
  main{grid-template-columns:1fr;height:auto}
  nav{border-right:0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px}
  nav button{width:auto}
  nav .div{width:100%}
  aside{border-left:0;border-top:1px solid var(--line)}
  .jscroll{overflow:visible}
  .jfoot{position:sticky;bottom:0;box-shadow:0 -4px 12px rgba(0,0,0,.06)}
  .keys{display:none}
  .f.short{grid-column:span 2}
}
</style>
</head>
<body>
<header>
  <span class="brand">Lommekort</span>
  <input id="q" type="search" placeholder="Søg kontaktårsag …  ( / )" autocomplete="off" aria-label="Søg kort">
  <span class="keys"><kbd>/</kbd> søg · <kbd>↵</kbd> åbn · <kbd>Tab</kbd> felter · <kbd>Ctrl</kbd>+<kbd>↵</kbd> kopiér notat · <kbd>.</kbd> u.a. · <kbd>Alt</kbd>+<kbd>I</kbd> indsæt sikkerhedsnet · <kbd>Alt</kbd>+<kbd>N</kbd> ny patient</span>
</header>
<main>
  <nav id="list" aria-label="Kort"></nav>
  <div id="card"><div class="empty">Søg efter en kontaktårsag, eller vælg et kort til venstre.</div></div>
  <aside id="journal" aria-label="Journalbygger"></aside>
</main>
<div id="toast" role="status"></div>
<script>
const CARDS = /*__DATA__*/[];
const BUILD = "__BUILD__";
const $ = s => document.querySelector(s);
let current = null, kbIndex = 0, filtered = CARDS.slice();

function norm(s){return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
function score(c,q){
  if(!q) return 100;
  const t = norm(c.title), s = norm(c.search), qq = norm(q);
  if (t.startsWith(qq)) return 100;
  if (t.split(/[\s/()]+/).some(w=>w.startsWith(qq))) return 80;
  if (t.includes(qq)) return 60;
  if (s.includes(qq)) return 20;
  return 0;
}

/* ---------- kortliste ---------- */
function renderList(){
  const q = $("#q").value.trim();
  filtered = CARDS.map(c=>[score(c,q),c]).filter(x=>x[0]>0)
    .sort((a,b)=>b[0]-a[0]||a[1].title.localeCompare(b[1].title,"da"));
  if (kbIndex >= filtered.length) kbIndex = 0;
  let html = "", divided = false;
  filtered.forEach(([sc,c],i)=>{
    if (q && sc < 60 && !divided){ html += `<div class="div">Nævnt i</div>`; divided = true; }
    html += `<button data-i="${CARDS.indexOf(c)}" class="${current===c?'active':''} ${q&&i===kbIndex?'kb':''}"><span>${esc(c.title)}</span><span class="badge ${c.status}">${c.status==="APPROVED"?"✓":"DRAFT"}</span></button>`;
  });
  $("#list").innerHTML = html || `<div class="empty">Intet kort matcher.</div>`;
  filtered = filtered.map(x=>x[1]);
  $("#list").querySelectorAll("button").forEach(b=>b.onclick=()=>openCard(CARDS[+b.dataset.i],true));
}

/* ---------- kort ---------- */
function openCard(c, focusJournal){
  current = c;
  const statusTxt = c.status==="APPROVED" ? `APPROVED · kontrolleret ${esc(c.checked)}` : "DRAFT – ikke verificeret af DB";
  const pending = c.pending ? `<div class="callout callout-warning"><div class="callout-title">Nye linjer afventer din godkendelse</div><div>${esc(c.pending)}</div></div>` : "";
  const srcs = c.links.length ? `<div class="srcs"><strong>Kilder:</strong>${c.links.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("")}<a href="https://pro.medicin.dk" target="_blank" rel="noopener">pro.medicin.dk</a></div>` : "";
  $("#card").innerHTML = `<h1>${esc(c.title)}</h1><div class="meta"><span class="badge ${c.status}">${statusTxt}</span> · ${esc(c.id)}</div>${pending}${srcs}`
    + c.sections.map(s=>`<details class="sec-${s.heading[0]}" ${s.open?"open":""}><summary>${esc(s.heading)}</summary>${s.html.replace(/<table>/g,'<div class="tblwrap"><table>').replace(/<\/table>/g,'</table></div>')}</details>`).join("")
    + `<div class="foot">${c.footer}</div>`;
  $("#card").scrollTop = 0;
  renderJournal(c);
  renderList();
  if (focusJournal) { const f = $("#journal .jscroll input, #journal .jscroll textarea"); f && f.focus(); }
}

/* ---------- journalbygger ---------- */
function isShort(f){ return !f.wide && !f.options.length && f.label.length <= 4; }

function renderJournal(c){
  const lines = c.journal.map((l,li)=>{
    if (l.redflags){
      const chips = l.redflags.map((r,ri)=>`<button type="button" class="chip" id="rf_${ri}" data-s="0">${esc(r)}</button>`).join("");
      return `<div class="jline"><div class="jkey">Røde flag – spurgt til</div><div class="chips">${chips}</div><div class="hint">Klik/mellemrum skifter: tom → nej → JA. Tast <kbd>n</kbd> = nej, <kbd>j</kbd> = ja.</div></div>`;
    }
    const fs = l.fields.map((f,fi)=>{
      const id = `f_${li}_${fi}`;
      const dl = f.options.length ? `<datalist id="dl_${id}">${f.options.map(o=>`<option value="${esc(o)}">`).join("")}</datalist>` : "";
      const ph = f.hint && f.hint!==f.label ? f.hint : (f.options.join(" / "));
      const input = f.wide
        ? `<textarea id="${id}" rows="1" placeholder="${esc(ph)}"></textarea>`
        : `<input id="${id}" ${f.options.length?`list="dl_${id}"`:""} placeholder="${esc(ph)}" autocomplete="off">`;
      const extra = f.safety ? `<div class="row">${input}<button class="mini" type="button" data-safety="${id}" title="Alt+I">Indsæt</button></div>` : input;
      const lab = f.label || l.key;
      const showLab = !(lab===l.key && l.fields.length===1);
      const cls = f.wide ? "wide" : (isShort(f) ? "short" : "");
      return `<div class="f ${cls}"><label for="${id}" ${showLab?"":'class="sr"'}>${esc(lab)}${f.suffix?` (${esc(f.suffix.trim())})`:""}</label>${extra}${dl}</div>`;
    }).join("");
    return `<div class="jline"><div class="jkey">${esc(l.key)}</div><div class="fgrid">${fs}</div></div>`;
  }).join("");
  $("#journal").innerHTML = `<div class="jscroll"><h3><span>Journal</span><button class="mini" id="clearBtn" type="button" title="Alt+N">Ny patient</button></h3>${lines}</div>
    <div class="jfoot">
      <div id="check" aria-live="polite"></div>
      <div id="preview" aria-live="polite"></div>
      <div class="actions">
        <button class="btn" id="copyNote" type="button">Kopiér notat <kbd>Ctrl ↵</kbd></button>
        <button class="btn sec" id="copySafety" type="button" title="Ctrl+Shift+Enter">Kopiér sikkerhedsnet (til patient)</button>
      </div>
      <div class="privacy">Intet gemmes. Skriv ikke navn eller CPR. Felterne ryddes ved kortskift og "Ny patient". Bygget ${BUILD}.</div>
    </div>`;
  const J = $("#journal");
  J.querySelectorAll(".jscroll input, .jscroll textarea").forEach(el=>{
    el.addEventListener("input", ()=>{ el.closest(".f").classList.toggle("has", !!el.value.trim()); autosize(el); updatePreview(); });
    el.addEventListener("keydown", e=>{
      if (e.key==="." && !el.value && !e.ctrlKey && !e.metaKey && !e.altKey){ e.preventDefault(); el.value="u.a."; el.dispatchEvent(new Event("input")); }
    });
  });
  J.querySelectorAll(".chip").forEach(ch=>{
    ch.addEventListener("click", ()=>setChip(ch, (+ch.dataset.s+1)%3));
    ch.addEventListener("keydown", e=>{
      if (e.key==="n"||e.key==="N"){ e.preventDefault(); setChip(ch,1); }
      else if (e.key==="j"||e.key==="J"){ e.preventDefault(); setChip(ch,2); }
      else if (e.key==="Backspace"||e.key==="Delete"){ e.preventDefault(); setChip(ch,0); }
    });
  });
  J.querySelectorAll("[data-safety]").forEach(b=>b.onclick=()=>fillSafety(b.dataset.safety));
  $("#clearBtn").onclick = clearFields;
  $("#copyNote").onclick = copyNote;
  $("#copySafety").onclick = copySafety;
  updatePreview();
}
function setChip(ch, s){ ch.dataset.s = String(s); ch.setAttribute("aria-pressed", s ? "true" : "false"); updatePreview(); }
function autosize(el){ if(el.tagName==="TEXTAREA"){ el.style.height="auto"; el.style.height=Math.min(el.scrollHeight,160)+"px"; } }
function fillSafety(id){
  const el = document.getElementById(id); if(!el||!current) return;
  el.value = current.safetyJournal || current.safetyNet; el.dispatchEvent(new Event("input")); el.focus();
}
function val(li,fi){ const el = document.getElementById(`f_${li}_${fi}`); return el ? el.value.trim() : ""; }
function chips(){ return [...document.querySelectorAll("#journal .chip")].map(c=>({t:c.textContent, s:+c.dataset.s})); }

const SHORT = {P:"puls", T:"temp", AT:"almentilstand"};
function prettyLabel(lab, key){
  if (key==="O" && SHORT[lab]) return SHORT[lab];
  return lab.replace(/\s+(siden|i|i max)$/i, m => m.trim()==="siden" ? " (debut)" : " (varighed)");
}

function buildNote(){
  if(!current) return {text:"", untouched:[], rfOpen:[]};
  const out = [], untouched = []; let filled = 0;
  const cs = chips(), rfNo = cs.filter(c=>c.s===1).map(c=>c.t), rfYes = cs.filter(c=>c.s===2).map(c=>c.t), rfOpen = cs.filter(c=>c.s===0).map(c=>c.t);
  current.journal.forEach((l,li)=>{
    if (l.redflags){
      const p = [];
      if (rfYes.length) p.push(`Angiver ${rfYes.join(", ")}`);
      if (rfNo.length) p.push(`Benægter ${rfNo.join(", ")}`);
      if (p.length){ out.push(`Røde flag: ${p.join(". ")}.`); filled++; }
      return;
    }
    const parts = [];
    l.fields.forEach((f,fi)=>{
      const v = val(li,fi);
      if (v) {
        filled++;
        const lab = f.label && f.label!==f.hint ? f.label : (f.options.length ? f.hint + ":" : "");
        const sep = /:$/.test(lab) ? " " : (f.wide || f.safety ? ": " : " ");
        parts.push(lab ? `${lab}${sep}${v}${f.suffix}` : `${v}${f.suffix}`);
      } else if (!f.noUntouched) {
        untouched.push(prettyLabel(f.label || f.hint, l.key));
      }
    });
    if (parts.length) out.push(`${l.key}: ` + parts.map(x=>/[.!?]$/.test(x) ? x : x + ".").join(" "));
  });
  return {text: filled ? out.join("\n") : "", untouched, rfOpen};
}
function updatePreview(){
  const {text, untouched, rfOpen} = buildNote();
  $("#preview").textContent = text || "(Notatet bygges, mens du udfylder. Kun det udfyldte kommer med.)";
  const missingAP = current ? ["A","P"].filter(k=>{ const li=current.journal.findIndex(l=>l.key===k); return li>=0 && !val(li,0); }) : [];
  const rows = [];
  if (rfOpen.length) rows.push(`<div class="rf">Røde flag ikke afklaret: ${esc(rfOpen.join(", "))}</div>`);
  if (missingAP.length) rows.push(`<div class="ap">Mangler: ${missingAP.join(" og ")}</div>`);
  if (untouched.length) rows.push(`<details class="un"><summary>${untouched.length} felter ikke udfyldt – kommer ikke med i notatet</summary>${esc(untouched.join(", "))}</details>`);
  $("#check").innerHTML = rows.join("");
}
async function copyText(t, msg){
  if(!t){ toast("Intet at kopiere endnu"); return; }
  try { await navigator.clipboard.writeText(t); }
  catch(e){
    let ok=false;
    try { const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); ok=document.execCommand("copy"); ta.remove(); } catch(_){}
    if(!ok){ const r=document.createRange(); r.selectNodeContents($("#preview")); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("Kopiering blokeret – teksten er markeret, tryk Ctrl+C"); return; }
  }
  toast(msg);
}
function copyNote(){ copyText(buildNote().text, "Notat kopieret – sæt ind i journalen"); }
function copySafety(){ copyText(current ? current.safetyNet : "", "Sikkerhedsnet (patienttekst) kopieret"); }
function clearFields(){
  if(!current) return;
  $("#journal").querySelectorAll(".jscroll input, .jscroll textarea").forEach(el=>{ el.value=""; el.closest(".f").classList.remove("has"); autosize(el); });
  $("#journal").querySelectorAll(".chip").forEach(ch=>{ ch.dataset.s="0"; ch.removeAttribute("aria-pressed"); });
  updatePreview(); toast("Klar til ny patient"); const f=$("#journal .jscroll input, #journal .jscroll textarea"); f&&f.focus();
}
let tt; function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),1800); }

$("#q").addEventListener("input", ()=>{ kbIndex=0; renderList(); });
$("#q").addEventListener("keydown", e=>{
  if (e.key==="ArrowDown"){ kbIndex=Math.min(kbIndex+1, filtered.length-1); renderList(); e.preventDefault(); }
  else if (e.key==="ArrowUp"){ kbIndex=Math.max(kbIndex-1,0); renderList(); e.preventDefault(); }
  else if (e.key==="Enter" && filtered[kbIndex]){ openCard(filtered[kbIndex], true); e.preventDefault(); }
  else if (e.key==="Escape"){ $("#q").value=""; renderList(); }
});
document.addEventListener("keydown", e=>{
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (e.key==="/" && !typing){ e.preventDefault(); $("#q").focus(); $("#q").select(); }
  else if ((e.ctrlKey||e.metaKey) && e.key==="k"){ e.preventDefault(); $("#q").focus(); $("#q").select(); }
  else if ((e.ctrlKey||e.metaKey) && e.key==="Enter"){ e.preventDefault(); e.shiftKey ? copySafety() : copyNote(); }
  else if (e.altKey && e.code==="KeyN"){ e.preventDefault(); clearFields(); }
  else if (e.altKey && e.code==="KeyI"){ e.preventDefault(); const b=$("#journal [data-safety]"); b && fillSafety(b.dataset.safety); }
});
renderList();
$("#q").focus();
</script>
</body>
</html>
